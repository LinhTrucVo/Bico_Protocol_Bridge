
name: Build and Test

on: [push, pull_request]

jobs:
  doc_gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Build Document
        run: "sudo 5_buildEnviroment/docGen/docGen.sh"

      - name: Upload docGen artifact
        uses: actions/upload-artifact@v4
        with:
          name: docGen
          path: ${{ github.workspace }}/_build/docGen

  unit_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Build Unit Tests
        run: "sudo 5_buildEnviroment/unitTestBuild/unitTestBuild.sh"

      - name: Upload unitTestBuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: unitTestBuild
          path: ${{ github.workspace }}/_build/unitTestBuild
          
